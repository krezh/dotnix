---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Build CI

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    branches: ["main"]
    paths: &paths
      - "**/*.nix"
      - "pkgs/**"
      - "flake.nix"
      - "flake.lock"
  push:
    branches: ["main"]
    paths: *paths

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  generate-matrix:
    name: Generate Build Matrix
    runs-on: ubuntu-latest
    environment:
      name: prod
    permissions:
      id-token: write
    outputs:
      hosts: ${{ steps.set-matrix.outputs.hosts }}
      packages: ${{ steps.set-matrix.outputs.packages }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          xilo-url: https://xilo.plexuz.xyz
          xilo-cache: ${{ secrets.XILO_CACHE }}
          xilo-token: ${{ secrets.XILO_TOKEN }}
          nothing-but-nix: false
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install nix-eval-jobs
        run: nix profile install github:nix-community/nix-eval-jobs

      - name: Generate Matrix
        id: set-matrix
        timeout-minutes: 15
        run: |
          set -Eeuo pipefail
          nix-eval-jobs \
            --flake .#ci \
            --workers $(nproc) \
            --gc-roots-dir /tmp/gcroots > /tmp/eval.jsonl

          if jq -es 'any(.error != null)' /tmp/eval.jsonl | grep -q true; then
            jq -s -r 'map(select(.error != null) | "\(.attr): \(.error)") | "❌ Evaluation errors:\n" + join("\n")' /tmp/eval.jsonl
            exit 1
          fi

          # Cache-status check done via a single batched `nix build --dry-run`
          # instead of nix-eval-jobs's --check-cache-status: that flag makes
          # nix-eval-jobs recursively walk the full derivation graph one drv at
          # a time to compute a per-input breakdown this workflow never uses,
          # which is what caused 15+ min hangs on lock-file-maintenance PRs.
          # `nix build --dry-run` reuses Nix's own native, batched
          # queryMissing() to get the same "would this need building" answer
          # in one shot.
          mapfile -t drvs < <(jq -r '.drvPath' /tmp/eval.jsonl)
          installables=("${drvs[@]/%/^*}")
          nix build --dry-run "${installables[@]}" > /dev/null 2> /tmp/dryrun.log

          awk '
            /^these [0-9]+ derivations will be built/ { section = "build"; next }
            /^these [0-9]+ paths will be fetched/     { section = "fetch"; next }
            /^  \/nix\/store\// {
              path = $0; sub(/^  /, "", path)
              if (section == "build") print path >> "/tmp/will-build.txt"
              next
            }
            { section = "" }
          ' /tmp/dryrun.log
          touch /tmp/will-build.txt

          all=$(jq -sc \
            --rawfile wb /tmp/will-build.txt \
            '($wb | split("\n")) as $notbuilt |
             map(select(.drvPath as $d | $notbuilt | index($d) != null) | {
               attr: .attr,
               target: (.attr | ltrimstr("packages.")),
               name: (.attr | ltrimstr("hosts.") | ltrimstr("packages.")),
               runner: (.system | if . == "aarch64-linux" then "ubuntu-24.04-arm" else "ubuntu-latest" end)
             })' /tmp/eval.jsonl)

          echo "hosts=$(echo "$all" | jq -c '{include: [.[] | select(.attr | startswith("hosts."))]}')" >> "$GITHUB_OUTPUT"
          echo "packages=$(echo "$all" | jq -c '{include: [.[] | select(.attr | startswith("packages."))]}')" >> "$GITHUB_OUTPUT"

  build-hosts:
    name: Build Hosts
    needs: generate-matrix
    if: ${{ github.event.pull_request.draft != true &&
      fromJson(needs.generate-matrix.outputs.hosts ||
      '{"include":[]}').include[0] != null }}
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    uses: ./.github/workflows/build-hosts.yaml # zizmor: ignore[secrets-inherit]
    secrets: inherit
    with:
      matrix: ${{ needs.generate-matrix.outputs.hosts }}

  build-packages:
    name: Build Packages
    needs: generate-matrix
    if: ${{ fromJson(needs.generate-matrix.outputs.packages ||
      '{"include":[]}').include[0] != null }}
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    uses: ./.github/workflows/build-packages.yaml # zizmor: ignore[secrets-inherit]
    secrets: inherit
    with:
      matrix: ${{ needs.generate-matrix.outputs.packages }}
