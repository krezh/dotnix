---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Build CI

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    branches: ["main"]
    paths: &paths
      - "**/*.nix"
      - "pkgs/**"
      - "flake.nix"
      - "flake.lock"
  push:
    branches: ["main"]
    paths: *paths

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  generate-matrix:
    name: Generate Build Matrix
    runs-on: ubuntu-latest
    environment:
      name: prod
    permissions:
      id-token: write
    outputs:
      hosts: ${{ steps.set-matrix.outputs.hosts }}
      packages: ${{ steps.set-matrix.outputs.packages }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          xilo-url: https://xilo.plexuz.xyz
          xilo-cache: ${{ secrets.XILO_CACHE }}
          xilo-token: ${{ secrets.XILO_TOKEN }}
          nothing-but-nix: false
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install nix-eval-jobs
        run: nix profile install github:nix-community/nix-eval-jobs

      - name: Generate Matrix
        id: set-matrix
        timeout-minutes: 15
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/diag
          nix shell nixpkgs#gdb --command true

          nix-eval-jobs \
            --flake .#ci \
            --check-cache-status \
            --workers 1 \
            --gc-roots-dir /tmp/gcroots > /tmp/diag/eval-output.jsonl 2> /tmp/diag/eval-stderr.log &
          EVAL_PID=$!

          (
            i=0
            while kill -0 "$EVAL_PID" 2>/dev/null; do
              sleep 60
              i=$((i + 1))
              {
                echo "=== snapshot $i at $(date -u -Iseconds) ==="
                echo "--- process tree ---"
                ps -eLf --forest
                echo "--- nix-eval-jobs pids: wchan + status ---"
                for p in $(pgrep -f nix-eval-jobs); do
                  echo "pid=$p cmd=$(tr '\0' ' ' < /proc/$p/cmdline 2>/dev/null)"
                  echo "wchan=$(cat /proc/$p/wchan 2>/dev/null)"
                  cat /proc/$p/status 2>/dev/null | head -5
                done
                echo "--- sockets ---"
                ss -tnp 2>/dev/null || true
                echo "--- gdb backtrace of main eval process ($EVAL_PID) ---"
                GDB_BIN="$(nix shell nixpkgs#gdb --command which gdb)"
                "$GDB_BIN" -p "$EVAL_PID" -batch -ex "thread apply all bt" 2>&1 || \
                  sudo "$GDB_BIN" -p "$EVAL_PID" -batch -ex "thread apply all bt" 2>&1 || true
              } >> "/tmp/diag/snapshot-$i.log" 2>&1
            done
          ) &
          MONITOR_PID=$!

          set +e
          wait "$EVAL_PID"
          EVAL_EXIT=$?
          set -e
          kill "$MONITOR_PID" 2>/dev/null || true

          if [ "$EVAL_EXIT" -ne 0 ]; then
            echo "nix-eval-jobs exited with $EVAL_EXIT"
            cat /tmp/diag/eval-stderr.log
            exit "$EVAL_EXIT"
          fi

          all=$(cat /tmp/diag/eval-output.jsonl | \
            jq -sc 'if any(.error != null) then (map(select(.error != null) | "\(.attr): \(.error)") | "❌ Evaluation errors:\n" + join("\n")) | halt_error(1) else map(select(.cacheStatus == "notBuilt") | {
              attr: .attr,
              target: (.attr | ltrimstr("packages.")),
              name: (.attr | ltrimstr("hosts.") | ltrimstr("packages.")),
              runner: (.system | if . == "aarch64-linux" then "ubuntu-24.04-arm" else "ubuntu-latest" end)
            }) end')

          echo "hosts=$(echo "$all" | jq -c '{include: [.[] | select(.attr | startswith("hosts."))]}')" >> "$GITHUB_OUTPUT"
          echo "packages=$(echo "$all" | jq -c '{include: [.[] | select(.attr | startswith("packages."))]}')" >> "$GITHUB_OUTPUT"

      - name: Upload eval diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eval-diagnostics
          path: /tmp/diag/
          retention-days: 3
          if-no-files-found: ignore

  build-hosts:
    name: Build Hosts
    needs: generate-matrix
    if: ${{ github.event.pull_request.draft != true &&
      fromJson(needs.generate-matrix.outputs.hosts ||
      '{"include":[]}').include[0] != null }}
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    uses: ./.github/workflows/build-hosts.yaml # zizmor: ignore[secrets-inherit]
    secrets: inherit
    with:
      matrix: ${{ needs.generate-matrix.outputs.hosts }}

  build-packages:
    name: Build Packages
    needs: generate-matrix
    if: ${{ fromJson(needs.generate-matrix.outputs.packages ||
      '{"include":[]}').include[0] != null }}
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    uses: ./.github/workflows/build-packages.yaml # zizmor: ignore[secrets-inherit]
    secrets: inherit
    with:
      matrix: ${{ needs.generate-matrix.outputs.packages }}
