---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Build Hosts

on:
  workflow_call:
    inputs:
      matrix:
        description: "Build matrix from nix-eval-jobs"
        required: true
        type: string

jobs:
  build:
    name: ${{ matrix.name }}
    if: ${{ fromJson(inputs.matrix || '{"include":[]}').include[0] != null }}
    runs-on: ${{ matrix.runner }}
    environment:
      name: prod
    strategy:
      matrix: ${{ fromJSON(inputs.matrix) }}
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          xilo-url: https://xilo.plexuz.xyz
          xilo-cache: ${{ secrets.XILO_CACHE }}
          xilo-token: ${{ secrets.XILO_TOKEN }}
          skip-cache: ${{ github.event.pull_request.head.repo.fork }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Host
        id: build
        uses: ./.github/actions/nix-build
        with:
          target: ${{ matrix.target }}
          build-type: system
          output-link: result

      - name: Push built derivations
        if: ${{ always() && github.event.pull_request.head.repo.fork != true }}
        shell: bash
        env:
          DRVS_JSON: ${{ toJSON(matrix.drvs) }}
        run: |
          set -Eeuo pipefail
          paths=()
          while IFS= read -r drv; do
            [ -e "$drv" ] || continue
            while IFS= read -r out; do
              [ -n "$out" ] || continue
              nix path-info "$out" >/dev/null 2>&1 && paths+=("$out")
            done < <(nix-store -q --outputs "$drv" 2>/dev/null || true)
          done < <(jq -r '.[]' <<< "$DRVS_JSON")

          if [ "${#paths[@]}" -gt 0 ]; then
            for attempt in 1 2 3 4 5; do
              if xilo push ${{ secrets.XILO_CACHE }} "${paths[@]}"; then
                break
              elif [ "$attempt" -eq 5 ]; then
                exit 1
              else
                echo "Push attempt $attempt failed, retrying..."
                sleep $((attempt * 15))
              fi
            done
          else
            echo "No built derivations available to push."
          fi

      - name: Output build failure
        if: failure()
        id: output-failure
        shell: bash
        run: |
          drv=$(grep "For full logs, run" /tmp/nix-build-err.log | grep -oE '/nix/store/[^ ]+\.drv' | head -1 || true)
          if [ -n "$drv" ]; then
            nix log "$drv" || grep -v "dependencies of derivation.*failed to build" /tmp/nix-build-err.log | grep -A4 "^error:" || true
          else
            grep -v "dependencies of derivation.*failed to build" /tmp/nix-build-err.log | grep -A4 "^error:" || true
          fi > /tmp/error-log-out.txt
          cat /tmp/error-log-out.txt
          delimiter=$(openssl rand -hex 16)
          {
            echo "error-log<<${delimiter}"
            cat /tmp/error-log-out.txt
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"

      - name: Post build comment
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: ./.github/actions/post-build-comment
        with:
          build-type: system
          build-name: ${{ matrix.attr }}
          build-status: ${{ steps.build.outcome }}
          flake-target: ${{ matrix.target }}
          error-log: ${{ steps.output-failure.outputs.error-log }}
          build-duration: ${{ steps.build.outputs.build_duration }}
          runner: ${{ matrix.runner }}
          pr-number: ${{ github.event.pull_request.number }}
