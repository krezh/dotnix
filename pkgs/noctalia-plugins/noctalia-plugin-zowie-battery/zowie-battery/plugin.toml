id = "krezh/zowie-battery"
name = "ZOWIE Battery"
version = "0.1.0"
plugin_api = 31
author = "krezh"
license = "MIT"
icon = "mouse"
description = "Bar indicator for the battery of a BenQ ZOWIE DW wireless mouse; hidden while no receiver or wired mouse is connected."
tags = ["bar", "indicator", "hardware"]
dependencies = ["zowie-batt"]

[[setting]]
key = "refresh_seconds"
type = "int"
label_key = "settings.refresh_seconds.label"
description_key = "settings.refresh_seconds.description"
default = 60
min = 10
max = 3600

[[setting]]
key = "low_percent"
type = "int"
label_key = "settings.low_percent.label"
description_key = "settings.low_percent.description"
default = 20
min = 5
max = 50

[[service]]
id = "service"
entry = "service.luau"

[[widget]]
id = "bar"
entry = "bar.luau"

  [widget.actions]
  right = "plugin krezh/zowie-battery:service all refresh"
