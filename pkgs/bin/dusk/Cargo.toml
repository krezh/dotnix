[package]
name = "dusk"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "A graceful logout, shutdown, and reboot interface for Hyprland"

[dependencies]
gdk4-wayland = "0.11"
gtk = { package = "gtk4", version = "0.11", features = ["v4_10"] }
gtk4-layer-shell = "0.8"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
wayland-backend = { version = "0.3", features = ["client_system", "dlopen"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
