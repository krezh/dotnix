[package]
name = "molt"
version = "0.1.0"
edition = "2024"

[dependencies]
gio = { version = "0.22", features = ["v2_80"] }
gtk = { package = "gtk4", version = "0.11", features = ["v4_22"] }
gtk4-layer-shell = "0.9"
libc = "0.2"
nix-changelog = { path = "../nix-changelog", default-features = false }
pulldown-cmark = { version = "0.13", default-features = false }
rusqlite = { version = "0.43", default-features = false, features = ["bundled"] }
rustix = { version = "1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
ureq = "3"
