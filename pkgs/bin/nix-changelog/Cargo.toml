[package]
name = "nix-changelog"
version = "0.1.0"
edition = "2024"

[lib]
name = "nix_changelog"
path = "src/lib.rs"

[[bin]]
name = "nix-changelog"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:clap", "dep:clap_complete", "dep:glamour", "dep:terminal_size"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"], optional = true }
clap_complete = { version = "4", optional = true }
glamour = { package = "charmed-glamour", version = "0.2", optional = true }
rustix = { version = "1", features = ["process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
terminal_size = { version = "0.4", optional = true }
ureq = { version = "3", features = ["json", "rustls"] }
url = "2"
