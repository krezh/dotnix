[package]
name = "nix-changelog"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "nix-changelog"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
glamour = { package = "charmed-glamour", version = "0.2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
terminal_size = "0.4"
ureq = { version = "3", features = ["json", "rustls"] }
url = "2"
