[package]
name = "optiman"
version = "0.1.0"
edition = "2021"
authors = ["krezh"]
description = "GTK4 manager for OptiScaler upscaling mod for Steam games"

[dependencies]
gtk4 = { version = "0.11", features = ["v4_12"] }
libadwaita = { version = "0.9", features = ["v1_5"] }
glib = "0.22"

reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

zip = "8.0"
sevenz-rust = "0.6"
tempfile = "3"

anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6.0"

[[bin]]
name = "optiman"
path = "src/main.rs"

[[bin]]
name = "optiman-run"
path = "src/bin/optiman_run.rs"
