[package]
name = "island"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.9", default-features = false, features = ["wayland"] }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", default-features = false, features = ["wayland"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v5"] }
raw-window-handle = "0.6"
wayland-backend = { version = "0.3", features = ["client_system", "dlopen"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-sys = { version = "0.31", features = ["client", "dlopen"] }
zbus = "5"
image = { version = "0.25", default-features = false }
libc = "0.2"
anyhow = "1"
libpulse-binding = "2"
ureq = "3"
toml = "1"
ddc-hi = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-journald = "0.3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true
