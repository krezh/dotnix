[package]
name = "island"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui_shared_string = { package = "gpui-pre-shared-string", version = "=0.3.11" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
icu_segmenter = { version = "2.3", default-features = false, features = ["compiled_data"] }
futures = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
uuid = { version = "1", features = ["v5"] }
raw-window-handle = "0.6"
wayland-backend = { version = "0.3", features = ["client_system", "dlopen"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }
wayland-sys = { version = "0.31", features = ["client", "dlopen"] }
zbus = "6"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
libc = "0.2"
anyhow = "1"
libpulse-binding = "2"
ureq = "3"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
notify = { version = "8.2", default-features = false }
tracing-journald = "0.3"
rusqlite = { version = "0.41", features = ["bundled-sqlcipher"] }
wgpu = { version = "30", default-features = false, features = ["vulkan", "wgsl"] }
cosmic-text = "0.19"
resvg = "0.46"
pollster = "0.4"
smithay-client-toolkit = { version = "0.21.1", default-features = false, features = ["xkbcommon"] }
taffy = "0.15"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true

[dev-dependencies]
naga = { version = "30.0.1", features = ["wgsl-in"] }
