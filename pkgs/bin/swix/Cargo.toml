[package]
name = "swix"
version = "0.1.0"
edition = "2024"

[dependencies]
gio = { version = "0.22", features = ["v2_80"] }
gtk = { package = "gtk4", version = "0.11" }
gtk4-layer-shell = "0.8"
libc = "0.2"
pulldown-cmark = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
